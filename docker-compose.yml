version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: sdd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdd_dev
      POSTGRES_PASSWORD: sdd_dev_2026
      POSTGRES_DB: sdd_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdd_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sdd_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Opcional: pgAdmin para administración visual de la BD
  pgadmin:
    image: dpage/pgadmin4
    container_name: sdd_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
